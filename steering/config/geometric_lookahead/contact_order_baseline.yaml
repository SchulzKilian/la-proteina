# Contact-order steering, BASELINE (no look-ahead, s == 1).
# Pushing contact order up = more long-range contacts = topologically harder
# folds = the more interesting designability stressor.
steering:
  method: geometric_lookahead
  enabled: true
  channel: bb_ca
  mode: baseline
  objectives:
    - property: contact_order
      direction: maximize
      weight: 1.0
  contact_order:
    threshold_nm: 0.80       # Cα-Cα contact distance
    temperature_nm: 0.05     # sigmoid softness
    min_seq_sep: 3
  schedule:
    type: linear_ramp
    w_max: 32.0
    t_start: 0.3
    t_end: 0.8
  proxy:
    bond_target_nm: 0.38
    clash_radius_nm: 0.40
    lambda_clash: 1.0
  gradient_norm: unit
  gradient_clip: 0.0
  log_diagnostics: true
