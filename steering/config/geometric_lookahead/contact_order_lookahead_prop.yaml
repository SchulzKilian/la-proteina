# Contact-order steering, PROPORTIONAL look-ahead (headline method).
steering:
  method: geometric_lookahead
  enabled: true
  channel: bb_ca
  mode: lookahead_proportional
  f_map: exp
  beta: 20.0
  objectives:
    - property: contact_order
      direction: maximize
      weight: 1.0
  contact_order:
    threshold_nm: 0.80
    temperature_nm: 0.05
    min_seq_sep: 3
  schedule:
    type: linear_ramp
    w_max: 32.0
    t_start: 0.3
    t_end: 0.8
  proxy:
    bond_target_nm: 0.38
    clash_radius_nm: 0.40
    lambda_clash: 1.0
  gradient_norm: unit
  gradient_clip: 0.0
  log_diagnostics: true
