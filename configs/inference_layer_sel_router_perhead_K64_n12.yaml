# Lower-half-sparse @ K=64 with the LEARNED router supplying a PER-(LAYER,
# HEAD) K-set. MHA modules on lower 7 layers swapped to
# MultiHeadBiasedAttentionADALN_MM_RouterSparse (weights bit-transferred).
# K=64 matches the router's training target (dense's top-K=64 attention).
# N=12 × L∈{50, 100, 200} × seed=5 × nsteps=400.
defaults:
  - inference_layer_sel_base
  - _self_

config_name: inference_layer_sel_router_perhead_K64_n12

generation:
  args:
    layer_sparse_mask: [true, true, true, true, true, true, true, false, false, false, false, false, false, false]
    n_seq_neighbors_override: 8
    n_spatial_neighbors_override: 16
    n_random_neighbors_override: 32
    router_ckpt_path: /home/ks2218/la-proteina/router_final.pt
    router_K: 64
    router_lower_layers: [0, 1, 2, 3, 4, 5, 6]
  dataset:
    nsamples: 12
    max_nsamples_per_batch: 6
    nlens_cfg:
      nres_lens: [50, 100, 200]
