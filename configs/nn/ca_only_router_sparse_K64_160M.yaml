# CA-only score NN — router-sparse K=64 variant for Move-2.
# Bit-equivalent to ca_only_score_nn_160M.yaml plus router_sparse_K=64, which
# switches every attention layer to PairBiasAttentionSparse and gathers a per-
# (batch, head, query) K-set from a frozen router attached in Proteina.__init__.
# DO NOT add other architectural deltas here — variant comparisons must be clean.

name: local_latents_transformer

output_parameterization:
  bb_ca: v

nlayers: 14
token_dim: 768
nheads: 12
parallel_mha_transition: False

strict_feats: False

feats_seq: ["xt_bb_ca", "x_sc_bb_ca", "optional_ca_coors_nm_seq_feat", "optional_res_type_seq_feat"]
feats_cond_seq: ["time_emb_bb_ca"]

dim_cond: 256
idx_emb_dim: 256
t_emb_dim: 256

feats_pair_repr: ["rel_seq_sep", "xt_bb_ca_pair_dists", "x_sc_bb_ca_pair_dists", "optional_ca_pair_dist"]
feats_pair_cond: ["time_emb_bb_ca"]

xt_pair_dist_dim: 30
xt_pair_dist_min: 0.1
xt_pair_dist_max: 3
x_sc_pair_dist_dim: 30
x_sc_pair_dist_min: 0.1
x_sc_pair_dist_max: 3
seq_sep_dim: 127
pair_repr_dim: 256

update_pair_repr: False
update_pair_repr_every_n: 3
use_tri_mult: False
use_downsampling: False

use_qkln: True

# Move-2 sentinel: when set, the trunk uses MultiheadAttnAndTransitionRouterSparse
# instead of MultiheadAttnAndTransition. K=64 matches §11 / E064 / E068.
router_sparse_K: 64
