# Sparse-attention DENSE-MATCH sanity arm.
#
# Same recipe as the canonical CA-only baseline (wd=0.05, constant LR=2e-4)
# and the K=40 sparse arm — the ONLY deltas are:
#   1. NN config -> ca_only_sparse_K512_dense_match_160M (K=N)
#   2. dataset.datamodule.batch_size: 6 -> 3 (sparse K=N blows up the
#      [B,H,N,K,D] gather tensor; halving batch keeps activations in 80GB).
#   3. opt.accumulate_grad_batches: 32 -> 64 (holds eff. batch ≈ 192,
#      matching the baseline/K=40 arm so the comparison is clean).
#
# See `ca_only_sparse_K512_dense_match_160M.yaml` for the rationale of the
# K-choice. Run-name is unique so chained slots and wandb grouping don't
# collide with the K=40 arm.
run_name_: ca_only_sparse_K512_dense_match

hardware:
  ncpus_per_task_train_: 24
  ncpus_per_task_prepro_: 24
  accelerator: gpu
  ngpus_per_node_: 1
  nnodes_: 1

defaults:
  - dataset: pdb/pdb_train_ucond
  - nn: ca_only_sparse_K512_dense_match_160M
  - generation: validation_local_latents
  - _self_

pretrain_ckpt_path:

product_flowmatcher:
  bb_ca:
    zero_com_noise: True
    guidance_enabled: True
    dim: 3

loss:
  t_distribution:
    bb_ca:
      name: mix_unif_beta
      p1: 1.9
      p2: 1.0
      p3: 0.02
    shared_groups:

force_precision_f32: False

dataset:
  datamodule:
    # Halved from baseline (6 -> 3) to absorb the K=512 gather blowup.
    # Effective batch is held constant by accumulate_grad_batches: 64 below.
    batch_size: 3
    dataselector:
      worst_resolution: 2.0

training:
  n_recycle: 0
  motif_conditioning: False
  self_cond: True
  p_folding_n_inv_folding_iters: 0.0
  use_precomputed_latents: False

lora:
  r: null
  lora_alpha: 32.0
  lora_dropout: 0.0
  train_bias: none

# OLD recipe — DO NOT change wd or add a scheduler block.
# Constant LR=2e-4; accumulate_grad_batches doubled (32 -> 64) to compensate
# for the halved per-iter batch_size, so opt-step semantics match baseline.
opt:
  lr: 0.0002
  max_epochs: 10000000
  accumulate_grad_batches: 64
  skip_nan_grad: False
  grad_and_weight_analysis: False
  dist_strategy: auto
  val_check_interval: 2000
  weight_decay: 0.05

log:
  wandb_project: laproteina
  log_wandb: True
  log_every_n_steps: 1
  checkpoint: True
  checkpoint_every_n_steps: 10000
  last_ckpt_every_n_steps: 500

seed: 42

ema:
  decay: 0.999
  validate_original_weights: False
  every_n_steps: 5
  cpu_offload: False

single: False
nolog: False
