# Layer-hybrid CA-only variant: 7 sparse (front_plateau_then_taper K-schedule)
# + 7 dense, trained FROM SCRATCH. Native/trained analogue of the inference-time
# layer-selective stitching (E092-E096). See configs/nn/ca_only_hybrid_7s7d_160M.yaml.
#
# RECIPE: locked to the canonical OLD recipe (wd=0.05, constant LR=2e-4, no
# scheduler) — identical to training_ca_only_sparse.yaml so the hybrid-vs-sparse
# and hybrid-vs-dense comparisons stay clean. The ONLY architecture-level delta
# from the sparse run is the NN config (ca_only_hybrid_7s7d_160M vs
# ca_only_sparse_160M), which itself only adds layer_sparse_mask + layer_K_splits.
run_name_: ca_only_hybrid_7s7d

hardware:
  ncpus_per_task_train_: 24
  ncpus_per_task_prepro_: 24
  accelerator: gpu
  ngpus_per_node_: 1
  nnodes_: 1

defaults:
  - dataset: pdb/pdb_train_ucond
  - nn: ca_only_hybrid_7s7d_160M
  - generation: validation_local_latents
  - _self_

pretrain_ckpt_path:

product_flowmatcher:
  bb_ca:
    zero_com_noise: True
    guidance_enabled: True
    dim: 3

loss:
  t_distribution:
    bb_ca:
      name: mix_unif_beta
      p1: 1.9
      p2: 1.0
      p3: 0.02
    shared_groups:

force_precision_f32: False

dataset:
  datamodule:
    dataselector:
      worst_resolution: 2.0

training:
  n_recycle: 0
  motif_conditioning: False
  self_cond: True
  p_folding_n_inv_folding_iters: 0.0
  use_precomputed_latents: False

lora:
  r: null
  lora_alpha: 32.0
  lora_dropout: 0.0
  train_bias: none

# OLD recipe — DO NOT change wd or add a scheduler block.
# Constant LR=2e-4 is achieved by omitting `scheduler:` entirely.
opt:
  lr: 0.0002
  max_epochs: 10000000
  accumulate_grad_batches: 32
  skip_nan_grad: False
  grad_and_weight_analysis: False
  dist_strategy: auto
  val_check_interval: 2000
  weight_decay: 0.05

log:
  wandb_project: laproteina
  log_wandb: True
  log_every_n_steps: 1
  checkpoint: True
  checkpoint_every_n_steps: 10000
  last_ckpt_every_n_steps: 500

seed: 42

ema:
  decay: 0.999
  validate_original_weights: False
  every_n_steps: 5
  cpu_offload: False

single: False
nolog: False
