# Dynamic-K sparse variant of the CA-only baseline.
#
# RECIPE: locked to the canonical OLD recipe (wd=0.05, constant LR=2e-4).
# See CLAUDE.md "Canonical baseline run" for why these values are non-negotiable.
#
# The only difference from training_ca_only_sparse.yaml is the NN config
# (`ca_only_sparse_dynamicK_160M` vs `ca_only_sparse_160M`), which sets a
# per-protein neighbor budget K_b = clamp(round(0.5*L_b), 16, L_b) instead of a
# fixed K=40. Everything else mirrors the sparse baseline run.
#
# compile_nn is deliberately left OFF (default): the per-forward tensor K
# dimension is set by the longest protein in each batch and therefore varies
# step-to-step, which is incompatible with torch.compile's reduce-overhead /
# cudagraph path. Eager mode handles the varying K with no recompile penalty.
run_name_: ca_only_sparse_dynK05

hardware:
  ncpus_per_task_train_: 24
  ncpus_per_task_prepro_: 24
  accelerator: gpu
  ngpus_per_node_: 1
  nnodes_: 1

defaults:
  - dataset: pdb/pdb_train_ucond
  - nn: ca_only_sparse_dynamicK_160M
  - generation: validation_local_latents
  - _self_

pretrain_ckpt_path:

product_flowmatcher:
  bb_ca:
    zero_com_noise: True
    guidance_enabled: True
    dim: 3

loss:
  t_distribution:
    bb_ca:
      name: mix_unif_beta
      p1: 1.9
      p2: 1.0
      p3: 0.02
    shared_groups:

force_precision_f32: False

dataset:
  datamodule:
    dataselector:
      worst_resolution: 2.0

training:
  n_recycle: 0
  motif_conditioning: False
  self_cond: True
  p_folding_n_inv_folding_iters: 0.0
  use_precomputed_latents: False

lora:
  r: null
  lora_alpha: 32.0
  lora_dropout: 0.0
  train_bias: none

# OLD recipe — DO NOT change wd or add a scheduler block.
# Constant LR=2e-4 is achieved by omitting `scheduler:` entirely.
opt:
  lr: 0.0002
  max_epochs: 10000000
  accumulate_grad_batches: 32
  skip_nan_grad: False
  grad_and_weight_analysis: False
  dist_strategy: auto
  val_check_interval: 2000
  weight_decay: 0.05

log:
  wandb_project: laproteina
  log_wandb: True
  log_every_n_steps: 1
  checkpoint: True
  checkpoint_every_n_steps: 10000
  last_ckpt_every_n_steps: 500

seed: 42

ema:
  decay: 0.999
  validate_original_weights: False
  every_n_steps: 5
  cpu_offload: False

single: False
nolog: False
