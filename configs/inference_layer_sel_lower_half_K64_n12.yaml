# Lower-half-sparse @ K=64 with the content-free (seq+spatial+random) K-set.
# K=64 SALAD-canonical decomposition: 2*8 + 16 + 32 = 64.
# N=12 × L∈{50, 100, 200} × seed=5 × nsteps=400.
defaults:
  - inference_layer_sel_base
  - _self_

config_name: inference_layer_sel_lower_half_K64_n12

generation:
  args:
    layer_sparse_mask: [true, true, true, true, true, true, true, false, false, false, false, false, false, false]
    n_seq_neighbors_override: 8
    n_spatial_neighbors_override: 16
    n_random_neighbors_override: 32
  dataset:
    nsamples: 12
    max_nsamples_per_batch: 6
    nlens_cfg:
      nres_lens: [50, 100, 200]
