# Lower-half-sparse @ K=40 with the LEARNED router supplying the K-set.
# Direct comparison to inference_layer_sel_lower_half_K40_n6.yaml (which uses
# the content-free seq+1/d³-spatial+random K-set). seed=5, same step-2646
# ckpt, same nsteps=400 — sole change is the per-query K-set source.
#
# Router: /home/ks2218/la-proteina/router_final.pt
#   TopKRouter trained Move-1 to mimic dense's top-K per-(layer, head) attention
#   on the same step-2646 ckpt. hidden=128, score=32, 14 layers × 12 heads,
#   pair_features=False, mlp_block=False (vanilla variant).
# Aggregation for the lower-half-sparse setting: max-pool over
#   (router_layer ∈ [0..6], head ∈ [0..11]) of [B, N, N] scores → top-40 per
#   query. One K-set per forward, applied to all 7 sparse trunk layers.
# Cost: 2× trunk forward per ODE step (one all-dense capture, one mixed).
defaults:
  - inference_layer_sel_base
  - _self_

config_name: inference_layer_sel_router_lower_K40_n6

generation:
  args:
    layer_sparse_mask: [true, true, true, true, true, true, true, false, false, false, false, false, false, false]
    # K-override fields are required by the existing override-block to wire
    # sparse_attention forward, but the K-set values themselves are not
    # consumed when router_ckpt_path is set — router supplies the K-set.
    n_seq_neighbors_override: 8
    n_spatial_neighbors_override: 8
    n_random_neighbors_override: 16
    router_ckpt_path: /home/ks2218/la-proteina/router_final.pt
    router_K: 40
    router_aggregate_layers: [0, 1, 2, 3, 4, 5, 6]
  dataset:
    nsamples: 6
    max_nsamples_per_batch: 6
    nlens_cfg:
      nres_lens: [50, 100, 200]
