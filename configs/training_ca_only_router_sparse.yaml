# CA-only Move-2 trunk: router-supplied K=64 sparse attention.
# Recipe matches training_ca_only.yaml (the canonical OLD recipe): AdamW(wd=0.05),
# constant LR=2e-4 (sqrt-scaled from 4-GPU baseline), no scheduler, EMA(0.999).
# DO NOT raise wd above 0.05 without first restructuring configure_optimizers
# to exclude AdaLN-Zero gates / LayerNorm / biases / embeddings from decay
# (CLAUDE.md → Finding 6).
#
# Move-2 deltas:
#   - nn: ca_only_router_sparse_K64_160M (router_sparse_K=64 sentinel; trunk
#     uses MultiheadAttnAndTransitionRouterSparse)
#   - router.ckpt_path: frozen TopKRouterT loaded by Proteina.__init__
#   - run_name_: fresh value so store dir is clean (no canonical-dense pollution)
#
# Train from scratch — no pretrain_ckpt_path. (Per Move-2 design: Q/K/V need to
# co-adapt to K=64 router supervision from init; starting from dense's weights
# would bias them toward dense-attention behaviour that doesn't transfer.)
run_name_: ca_only_router_sparse_K64_move2

hardware:
  ncpus_per_task_train_: 24
  ncpus_per_task_prepro_: 24
  accelerator: gpu
  ngpus_per_node_: 1
  nnodes_: 1

defaults:
  - dataset: pdb/pdb_train_ucond
  - nn: ca_only_router_sparse_K64_160M
  - generation: validation_local_latents
  - _self_

pretrain_ckpt_path:

product_flowmatcher:
  bb_ca:
    zero_com_noise: True
    guidance_enabled: True
    dim: 3

# Move-2: which router checkpoint to load + freeze.
# router_move1_inflight/router_final.pt: bigrouter + pair_features + t-emb,
# trained on canonical PDB dataloader L=50-512, recall@64 = 0.7557 @ step 18000.
router:
  ckpt_path: ${oc.env:PWD,/home/ks2218/la-proteina}/results/router_move1_inflight/router_final.pt

loss:
  t_distribution:
    bb_ca:
      name: mix_unif_beta
      p1: 1.9
      p2: 1.0
      p3: 0.02
    shared_groups:

force_precision_f32: False

dataset:
  datamodule:
    dataselector:
      worst_resolution: 2.0

training:
  n_recycle: 0
  motif_conditioning: False
  self_cond: True
  p_folding_n_inv_folding_iters: 0.0
  use_precomputed_latents: False

lora:
  r: null
  lora_alpha: 32.0
  lora_dropout: 0.0
  train_bias: none

opt:
  lr: 0.0002
  max_epochs: 10000000
  accumulate_grad_batches: 32
  skip_nan_grad: False
  grad_and_weight_analysis: False
  dist_strategy: auto
  val_check_interval: 2000
  weight_decay: 0.05

log:
  wandb_project: laproteina
  log_wandb: True
  log_every_n_steps: 1
  checkpoint: True
  checkpoint_every_n_steps: 10000
  last_ckpt_every_n_steps: 1500

seed: 42

ema:
  decay: 0.999
  validate_original_weights: False
  every_n_steps: 5
  cpu_offload: False

single: False
nolog: False
